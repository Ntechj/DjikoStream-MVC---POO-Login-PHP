services:
  djikostream:
    build: .
    image: djikostream:1.0
    container_name: djikostream

    ports:
      - "127.0.0.1:8000:8000"

    read_only: true

    tmpfs:
      - /tmp
      - /data:uid=10001,gid=10001
      - /config:uid=10001,gid=10001

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE
